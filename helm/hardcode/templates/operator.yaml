{{- $name := include "hardcode.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
---
# Everything the operator creates lives in this namespace, so a Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
rules:
  - apiGroups: [hardcode-app.github.io]
    resources: [profiles]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [hardcode-app.github.io]
    resources: [profiles/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps, secrets, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Volumes are created by the StatefulSet; the operator only grows them.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-admin
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-admin
    namespace: {{ .Release.Namespace }}
---
{{- if and .Values.profileDefaults.networkPolicy.enabled .Values.profileDefaults.networkPolicy.defaultDeny }}
# Nothing in or out for any sandbox pod unless one of its profile's own
# policies allows it. Installed before any profile exists; survives a failed
# reconcile.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-sandbox-default-deny
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hardcode-operator
  policyTypes: [Ingress, Egress]
---
{{- end }}
{{- if and (not .Values.admin.existingSecret) .Values.admin.email }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin-bootstrap
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.admin.email | quote }}
  password: {{ required "admin.password is required with admin.email" .Values.admin.password | quote }}
---
{{- end }}
{{- if and .Values.admin.smtp.host .Values.admin.smtp.username (not .Values.admin.smtp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin-smtp
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.admin.smtp.username | quote }}
  password: {{ required "admin.smtp.password is required with admin.smtp.username" .Values.admin.smtp.password | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hardcode.adminSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hardcode.adminSelector" . | nindent 8 }}
      annotations:
        checksum/defaults: {{ .Values.profileDefaults | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}-admin
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADMIN
              value: {{ .Values.admin.ui.enabled | ternary "1" "0" | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.admin.cookieSecure | quote }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.admin.trustedProxies | join "," | quote }}
            - name: PROFILE_DEFAULTS_JSON
              value: {{ .Values.profileDefaults | toJson | quote }}
            {{- with .Values.admin.url }}
            {{- if not (regexMatch "^https?://[^/]" .) }}
            {{- fail "admin.url is the admin UI's address, starting with https://" }}
            {{- end }}
            {{- end }}
            - name: ADMIN_URL
              value: {{ include "hardcode.adminURL" . | quote }}
            {{- with .Values.admin.smtp }}
            {{- if .host }}
            {{- if not (has .tls (list "starttls" "tls" "none")) }}
            {{- fail "admin.smtp.tls is starttls, tls or none" }}
            {{- end }}
            - name: SMTP_HOST
              value: {{ .host | quote }}
            - name: SMTP_PORT
              value: {{ .port | toString | quote }}
            - name: SMTP_TLS
              value: {{ .tls | quote }}
            - name: SMTP_FROM
              value: {{ required "admin.smtp.from is required with admin.smtp.host" .from | quote }}
            {{- if or .username .existingSecret }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "hardcode.smtpSecret" $ }}
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hardcode.smtpSecret" $ }}
                  key: password
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.admin.existingSecret .Values.admin.email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hardcode.bootstrapSecret" . }}
                  key: email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hardcode.bootstrapSecret" . }}
                  key: password
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    {{- include "hardcode.adminSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
{{- if .Values.admin.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "hardcode.labels" . | nindent 4 }}
  {{- with .Values.admin.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.admin.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.admin.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-admin
                port:
                  name: http
{{- end }}
