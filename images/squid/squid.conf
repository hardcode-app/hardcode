# Egress proxy for the VS Code container network. HTTPS is inspected: every tunnel is
# decrypted with the stack's own CA (generated by the "pki" service and
# trusted inside the VS Code container), so rules apply to full URLs and methods, not
# just hostnames. Rule files are rendered from the profile's allowlist.txt by
# allowlist-render.sh; squid reads its own copy of them, in
# /var/spool/squid/policy/, which its entrypoint takes from what the renderer
# published and replaces, checked, for each new policy before reloading
# squid in place.

# Squid sizes its descriptor tables from the process's open-file limit, which
# container runtimes may leave effectively unlimited (containerd: ~1 billion),
# and would then allocate tens of GB at start. This caps it.
max_filedescriptors 65536

http_port 3128 ssl-bump \
    tls-cert=/proxy-ca/ca.pem tls-key=/proxy-ca/ca.key \
    generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 16MB
sslcrtd_children 5

# Upstream certificates are verified against the system CA store; a bad
# upstream certificate is an error for the client, never silently accepted.
tls_outgoing_options cafile=/etc/ssl/certs/ca-certificates.crt min-version=1.2
sslproxy_cert_error deny all

# Who may use the proxy: the sandbox's network(s), rendered from CLIENT_RANGES.
acl localnet src "/var/spool/squid/policy/clients.txt"
# Where an allowlisted name must never point: loopback, link-local (cloud
# metadata), private and shared ranges, rendered from INTERNAL_RANGES. A dst
# ACL resolves the name, so it is checked only after the name/URL checks:
# a refused request still never triggers a lookup.
acl to_internal dst "/var/spool/squid/policy/internal.txt"
# Names pinned to an address on your network (the allowlist's "lan" lines):
# "pinned" matches a request for exactly a pinned name going to exactly its
# address, and so exempts it from to_internal. Squid resolves a pinned name
# from its hosts file alone (the entrypoint writes it, pinned names first,
# and leaves out any other line for them), never asking DNS, so the
# address can't move; any other name resolving there is still refused.
include /var/spool/squid/policy/pins.conf
hosts_file /var/spool/squid/policy/hosts
# Where no request may go, pinned or not: the networks squid is attached to
# (each interface's subnet and addresses, and each route's gateway, which is
# the host or the node; the entrypoint finds them at every start, as only
# squid can see them), and the sandbox's own network as the profile's
# settings name it (DEVNET_SUBNET, and on Kubernetes the cluster's own
# ranges; rendered from the allowlist's settings). Checked before anything
# a pin exempts, so that no pin can open them.
acl own_networks dst "/var/spool/squid/own-networks.txt"
acl sandbox_network dst "/var/spool/squid/policy/sandbox.txt"
acl never_pin any-of own_networks sandbox_network
# Tagged on to every rule that refuses a tunnel: deny_info keys on the last
# ACL of the rule that denied, and a refused tunnel must be reset, not answered.
acl refuse_tunnel src all
# Why a request was refused, for the log (and so for Blocked traffic): an
# annotation the log line ends with. It always matches, and sits at the end
# of the rules that refuse, so it only runs when they do.
acl refused_internal annotate_transaction refused=internal-address
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# -n: never reverse-resolve IP-literal requests; they just don't match.
acl allowed_hosts dstdomain -n "/var/spool/squid/policy/hosts.txt"
acl url_ro url_regex -i "/var/spool/squid/policy/urls-ro.regex"
acl url_rw url_regex -i "/var/spool/squid/policy/urls-rw.regex"
acl read_methods method GET HEAD OPTIONS
# git clone/fetch/pull POST to git-upload-pack; push goes to git-receive-pack.
acl git_fetch urlpath_regex /git-upload-pack$
acl POST method POST
# Path entries are textual prefixes, and an origin may normalise the path it
# receives: /allowed/../secret or /allowed/%2e%2e/secret pass a prefix check
# and land on /secret. A dot segment (one or two dots, plain or encoded, between
# separators, plain or encoded) is refused in every request. A lone %2f is
# fine: npm's scoped packages are /@scope%2fname.
acl traversal urlpath_regex -i ^[^?]*(/|\\|%2f|%5c)(\.|%2e){1,2}([^a-z0-9._~%-]|%2f|%5c|$)
# A backslash has no place in a URL path (RFC 3986), but origins on Windows
# treat one, plain or %5c-encoded, as a separator: /allowed\..\secret would
# pass the prefix check and land on /secret. Refused wherever it appears.
acl backslash urlpath_regex -i ^[^?]*(\\|%5c)

# Only port-, method- and domain-based ACLs are used before the deny, so a
# refused request never triggers a DNS lookup.
http_access deny manager
http_access deny !localnet
# SSH tunnels, one host:port per "ssh" entry in the allowlist. SSH can't be
# inspected, so these are whole-host and read-write.
include /var/spool/squid/policy/ssh.conf
on_unsupported_protocol respond all
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Names and URLs first (no lookups for refused requests), then the address
# the name resolves to (squid's and the sandbox's own networks, which no pin
# exempts, then the internal ranges, which a pin does for its name and
# address), then the allows.
http_access deny CONNECT !allowed_hosts refuse_tunnel
http_access deny traversal
http_access deny backslash
http_access deny !CONNECT !url_rw !url_ro
http_access deny CONNECT never_pin refused_internal refuse_tunnel
http_access deny never_pin refused_internal
http_access deny CONNECT to_internal !pinned refused_internal refuse_tunnel
http_access deny to_internal !pinned refused_internal
# HTTPS tunnels may only be opened to allowlisted hosts; the requests inside
# them are then checked individually.
http_access allow CONNECT
http_access allow url_rw
http_access allow url_ro read_methods
http_access allow url_ro git_fetch POST
http_access deny all

# A refused tunnel is reset outright. The default is to answer 200 and serve
# an error page inside a TLS handshake, which leaves a non-TLS client such as
# ssh waiting until it times out. Refused requests inside allowed tunnels
# still get a 403 page.
#
# Squid can only reset at once when it decided without waiting for DNS. A
# tunnel refused for where its name points, the first time the name is
# looked up, is answered 200 and then reset at the client's first bytes
# (a TLS hello, ssh's banner): nothing is passed through either way.
deny_info TCP_RESET refuse_tunnel
deny_info TCP_RESET Safe_ports
deny_info TCP_RESET SSL_ports

# Decrypt every tunnel whose TLS server name is allowlisted, and close one
# whose server name isn't. A tunnel with no server name is judged by its
# CONNECT host, which the rules above already required to be allowlisted.
# Non-TLS traffic is handled by on_unsupported_protocol above: tunnelled
# for ssh entries, refused otherwise.
acl step1 at_step SslBump1
acl allowed_sni ssl::server_name --client-requested "/var/spool/squid/policy/hosts.txt"
ssl_bump peek step1
ssl_bump bump allowed_sni
ssl_bump terminate all

# Don't reveal anything about the inside to upstream servers.
visible_hostname squid
forwarded_for delete
httpd_suppress_version_string on

# Pure forwarding proxy, nothing is cached.
cache deny all

# Log to the container output: `docker compose logs squid`, in squid's own
# format with why a request was refused at the end ("-" when there is no
# reason to give). (Not the healthcheck's local probes.)
logformat hardcode %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %{refused}note
acl healthcheck src 127.0.0.1
access_log stdio:/dev/stdout hardcode !healthcheck
cache_log /dev/stderr
logfile_rotate 0

pid_filename none
coredump_dir /tmp
shutdown_lifetime 2 seconds
# The ICMP helper needs raw sockets, which this container doesn't have.
pinger_enable off
