[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcode-admin"
version = "0.1.0"
description = "HardCode on Kubernetes: the operator and the admin UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
# The image installs all three as images/admin/uv.lock locks them; qrcode is
# optional (the enrolment page shows the secret as text without it).
dependencies = ["Flask>=3", "hardcode-cli"]

[project.optional-dependencies]
serve = ["gunicorn>=21"]
qr = ["qrcode>=7"]

[tool.setuptools.packages.find]
include = ["hardcode_admin*"]

[tool.setuptools.package-data]
hardcode_admin = ["web/*"]
