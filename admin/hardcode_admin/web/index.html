<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HardCode admin</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="brand"><img src="/icon.png" alt="" class="brand-icon"><div><div class="brand-name">HardCode</div><div class="brand-sub">admin · sandbox profiles</div></div></div>
      <div id="login-step-password">
        <div class="field"><label>Email</label><input type="email" id="lg-email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="lg-password" autocomplete="current-password"></div>
        <div class="form-error" id="lg-error"></div>
        <button class="btn primary" id="lg-submit">Sign in</button>
      </div>
      <div id="login-step-enrol" class="hidden">
        <p>Scan this with your authenticator app (Google Authenticator, 1Password, Authy…), then enter the code it shows.</p>
        <img id="lg-qr" alt="" class="qr">
        <div class="muted small mono" id="lg-secret"></div>
      </div>
      <div id="login-step-totp" class="hidden">
        <div class="field"><label>Authenticator code</label><input type="text" id="lg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="mono"></div>
        <div class="form-error" id="lg-code-error"></div>
        <button class="btn primary" id="lg-verify">Verify</button>
      </div>
    </div>
  </div>

  <div id="shell" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="/icon.png" alt="" class="brand-icon"><div><div class="brand-name">HardCode</div><div class="brand-sub">admin</div></div></div>
      <nav>
        <button class="nav-item active" data-view="profiles"><span class="nav-ico">▦</span>Profiles</button>
        <button class="nav-item hidden" data-view="requests"><span class="nav-ico">✉</span>Requests<span class="nav-count hidden" id="nav-requests"></span></button>
        <button class="nav-item admin-only hidden" data-view="bulk"><span class="nav-ico">⛨</span>All allowlists</button>
        <button class="nav-item admin-only hidden" data-view="users"><span class="nav-ico">⚇</span>People</button>
      </nav>
      <div class="sidebar-foot">
        <div class="muted small">Signed in as</div>
        <div id="me" class="small ellipsis"></div>
        <div id="ns" class="muted small mono"></div>
        <button class="btn ghost small" id="btn-logout">Sign out</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="topbar-left"><h1 id="view-title">Profiles</h1><span id="crumb" class="muted"></span></div>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toasts"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <script src="/app.js"></script>
</body>
</html>
