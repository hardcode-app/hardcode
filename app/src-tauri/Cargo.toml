[package]
name = "hardcode-app"
version = "0.1.0"
description = "HardCode: desktop control panel for the sandboxed development environment"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hardcode_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
