[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcode-cli"
version = "0.1.0"
description = "HardCode: profiles, allowlists, forwards, mounts and languages for the sandboxed development environment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# YAML is read and written with mikefarah's yq when it's installed, else
# PyYAML, else yq's container image; so nothing is required here.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
hardcode = "hardcode_cli.cli:main"

[tool.setuptools.packages.find]
include = ["hardcode_cli*"]
