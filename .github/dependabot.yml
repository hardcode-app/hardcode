version: 2

# Its commits follow Conventional Commits like everyone's (tests/commits.py):
# build(deps): bump ..., and ci(deps) for the actions.
updates:
  - package-ecosystem: cargo
    directory: /app/src-tauri
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
    groups:
      app: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: ["/admin", "/cli", "/images/build"]
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
  # Local composite actions aren't followed from the workflows that use them:
  # each one's folder is listed.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/build-image"]
    commit-message: { prefix: ci, include: scope }
    schedule: { interval: weekly }
  # coredns and docker (dind) are pinned in compose.yaml, in the chart's
  # values.yaml and as the operator's fallbacks in
  # admin/hardcode_admin/manifests.py. Dependabot moves the first only (its
  # Helm support reads values keys named "image", and the chart's are
  # corednsImage and dockerImage, as in the Profile's spec): the other two
  # follow by hand, in its pull request, and the admin tests fail until the
  # three agree.
  - package-ecosystem: docker-compose
    directory: /
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
  # The images' base: ubuntu.
  - package-ecosystem: docker
    directories: ["/images/vscode", "/images/squid", "/images/gateway", "/images/admin", "/images/build"]
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
