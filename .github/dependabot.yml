version: 2

# Every update is a week old before it is proposed (cooldown: a compromised
# release is usually found and pulled within days), and grouped: one pull
# request per ecosystem a week at most. Security updates aren't held back.
# CI's Pin ages job checks every pin a pull request changes is a week old
# too, transitive crates included, and maintenance/merge.py merges the patch
# and minor updates that pass (docs/development.md, "Dependencies").
#
# The images move together, in one pull request: Ubuntu's dated builds
# (resolute-YYYYMMDD) in the Dockerfiles, and CoreDNS and the Docker sidecar
# in compose.yaml and in the chart's values (keys named "image", which is
# what Dependabot reads there). Its updates leave their commit message and
# schedule to the group: Dependabot refuses them on the updates.
multi-ecosystem-groups:
  images:
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }

# Its commits follow Conventional Commits like everyone's (tests/commits.py):
# build(deps): bump ..., and ci(deps) for the actions.
updates:
  - package-ecosystem: cargo
    directory: /app/src-tauri
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      app: { patterns: ["*"] }
  # The Rust of the release's macOS and Windows builds (rust-toolchain.toml);
  # the build image's is the archive's.
  - package-ecosystem: rust-toolchain
    directory: /app/src-tauri
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  # uv itself (images/build/uv), pinned with its hashes, which this moves too.
  - package-ecosystem: pip
    directories: ["/admin", "/cli", "/images/build/uv"]
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"] }
  # The images' Python packages, as their uv.lock files lock them; the
  # cooldown is the projects' exclude-newer, a week, so that uv can lock what
  # is proposed. uv's own pin, under /images/build, is the pip entry's: left
  # out here, or each uv release would bring two pull requests.
  - package-ecosystem: uv
    directories: ["/images/admin", "/images/build"]
    commit-message: { prefix: build, include: scope }
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: uv
    groups:
      python-images: { patterns: ["*"] }
  # Local composite actions aren't followed from the workflows that use them:
  # each one's folder is listed. An action is code the workflows run with
  # their tokens: these are never merged without a person.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/build-image", "/.github/actions/buildx"]
    commit-message: { prefix: ci, include: scope }
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/images/vscode", "/images/squid", "/images/gateway", "/images/admin", "/images/build", "/.github/buildkit"]
    patterns: ["*"]
    multi-ecosystem-group: images
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: images
    cooldown: { default-days: 7 }
  - package-ecosystem: helm
    directory: /helm/hardcode
    patterns: ["*"]
    multi-ecosystem-group: images
    cooldown: { default-days: 7 }
