# The build image (images/build), loaded as hardcode-build:local, which is
# what tests/*.sh and app/build.sh run themselves in (images/build/run.sh).
# CI builds it with a BuildKit cache; the release workflow without one
# (cache: false), from nothing a CI job could have written.
name: Build image
description: Builds images/build as hardcode-build:local, cached unless asked not to
inputs:
  cache:
    description: Use and update the BuildKit cache ("true" or "false")
    default: "true"
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: images/build
        load: true
        tags: hardcode-build:local
        no-cache: ${{ inputs.cache != 'true' }}
        cache-from: ${{ inputs.cache == 'true' && 'type=gha,scope=build' || '' }}
        cache-to: ${{ inputs.cache == 'true' && 'type=gha,scope=build,mode=max' || '' }}
