# On a v* tag, a release (docs/releasing.md): the tag's version written into
# everything (release/release.py stamp), the images to GHCR, the desktop app
# for three platforms (with its updater, when release/updater.pub holds the
# key its updates are signed with), the hardcode command as binaries and as
# a Python package, the Helm chart as an OCI artifact, and a GitHub Release
# with all of it, the source, latest.json for the app's updater, checksums
# and notes. A manual run builds the same without a version, and publishes
# only the images' latest tag, from main. Linux builds happen in the build
# image (images/build), like everything else.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; the jobs that publish ask for what they push.
permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The tag without its v; empty on a manual run.
      version: ${{ steps.version.outputs.version }}
      # Where the images go: GHCR's names are lowercase, an owner's needn't be.
      prefix: ${{ steps.version.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Refuses a version a release can't carry, before anything is published.
            images/build/run.sh release/release.py stamp "$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hardcode" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: vscode,  context: images/vscode,  dockerfile: images/vscode/Dockerfile }
          - { name: squid,   context: images/squid,   dockerfile: images/squid/Dockerfile }
          - { name: gateway, context: images/gateway, dockerfile: images/gateway/Dockerfile }
          - { name: admin,   context: .,              dockerfile: images/admin/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The full VS Code image needs more disk than a runner has free by default.
      - if: matrix.image.name == 'vscode'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A prerelease gets its version only; latest is a release, or a manual run from main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.prefix }}-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ needs.version.outputs.version != '' && !contains(needs.version.outputs.version, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.image.name != 'vscode' && format('type=gha,scope={0}', matrix.image.name) || '' }}
          cache-to: ${{ matrix.image.name != 'vscode' && format('type=gha,scope={0},mode=max', matrix.image.name) || '' }}

  # Linux artifacts are built in the build image (images/build): the same
  # Ubuntu 26.04 toolchain as everywhere else. macOS and Windows installers
  # and binaries can only be built on those platforms, so those two run
  # natively; the exception, not the rule.
  app-linux:
    name: App linux-x64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hardcode-build
            app/src-tauri/target
          key: app-${{ hashFiles('app/src-tauri/Cargo.lock', 'images/build/**') }}
          restore-keys: app-
      - name: The release's version, and its updater
        if: env.VERSION != ''
        run: |
          images/build/run.sh release/release.py stamp "$VERSION"
          images/build/run.sh release/release.py updater-config --repository "$GITHUB_REPOSITORY" app/src-tauri/tauri.updater.conf.json
          echo "HARDCODE_UPDATER_CONFIG=src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
      - run: app/build.sh bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUILD_ENV: HARDCODE_UPDATER_CONFIG TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-linux-x64
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.deb.sig
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

  app-native:
    name: App ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   triple: aarch64-apple-darwin,   arch: aarch64 }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: The release's version, and its updater
        if: env.VERSION != ''
        shell: bash
        run: |
          python release/release.py stamp "$VERSION"
          python release/release.py updater-config --repository "$GITHUB_REPOSITORY" app/src-tauri/tauri.updater.conf.json
      - name: The CLI as a sidecar
        shell: bash
        run: |
          pip install -r cli/requirements.txt -r images/build/requirements.txt
          PYTHONPATH=cli python -m hardcode_cli.stack cli/hardcode_cli/stack
          pyinstaller --onefile --name hardcode --paths cli cli/hardcode --add-data "cli/hardcode_cli/stack:hardcode_cli/stack"
          mkdir -p app/src-tauri/binaries
          cp dist/hardcode* "app/src-tauri/binaries/hardcode-${{ matrix.triple }}$([[ '${{ runner.os }}' == Windows ]] && echo .exe || true)"
      # The build image's version of the Tauri CLI.
      - name: Tauri CLI
        shell: bash
        run: |
          version="$(sed -n 's/^ARG TAURI_CLI_VERSION=//p' images/build/Dockerfile)"
          cargo install tauri-cli --locked --version "=$version"
      - name: Build
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Unsigned macOS builds unless a certificate is provided as secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          configs=(--config src-tauri/tauri.release.conf.json)
          if [ -n "$VERSION" ]; then
            configs+=(--config src-tauri/tauri.updater.conf.json)
          fi
          cargo tauri build "${configs[@]}"
      # The macOS update file is called HardCode.app.tar.gz: named after its
      # architecture, like the other installers, to sit beside them.
      - name: Name the macOS update file
        if: runner.os == 'macOS'
        shell: bash
        working-directory: app/src-tauri/target/release/bundle/macos
        run: |
          for file in HardCode.app.tar.gz HardCode.app.tar.gz.sig; do
            if [ -f "$file" ]; then
              mv "$file" "HardCode_${{ matrix.arch }}${file#HardCode}"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/msi/*.msi.sig
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  cli-linux:
    name: CLI linux-x64, and its Python package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
      - name: The release's version
        if: env.VERSION != ''
        run: images/build/run.sh release/release.py stamp "$VERSION"
      - run: tests/cli.py
      - run: app/build.sh cli
      - run: app/build.sh wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: |
            dist/hardcode-*
            dist/hardcode_cli-*.whl
          if-no-files-found: error

  cli-native:
    name: CLI ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: macos-arm64 }
          - { os: windows-latest, target: win-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: The release's version
        if: env.VERSION != ''
        shell: bash
        run: python release/release.py stamp "$VERSION"
      - run: pip install -r cli/requirements.txt -r images/build/requirements.txt
      - run: python -m unittest discover -s cli -t cli
      - name: Build
        shell: bash
        run: |
          PYTHONPATH=cli python -m hardcode_cli.stack cli/hardcode_cli/stack
          pyinstaller --onefile --name "hardcode-${{ matrix.target }}" --paths cli cli/hardcode --add-data "cli/hardcode_cli/stack:hardcode_cli/stack"
      # The binary carries its stack: a profile can be made from it, in a home of its own.
      - name: Smoke
        shell: bash
        run: |
          binary="dist/hardcode-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            binary="$binary.exe"
          fi
          "$binary" --version
          HARDCODE_CONFIG="$RUNNER_TEMP/home" "$binary" profile add smoke --lang ""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/hardcode-*
          if-no-files-found: error

  chart:
    name: Helm chart
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
      - name: Package (in the build image)
        env:
          VER: ${{ needs.version.outputs.version || format('0.0.0-{0}', github.run_number) }}
          PREFIX: ${{ needs.version.outputs.prefix }}
          TAGGED: ${{ needs.version.outputs.version != '' }}
          BUILD_ENV: VER PREFIX TAGGED
        run: |
          images/build/run.sh bash -e <<'SH'
          # The packaged chart points at the images this workflow publishes, at this version
          # (a tagged release only: a manual run publishes no versioned images to point at).
          [ "$TAGGED" != true ] || python3 - "$VER" "$PREFIX" <<'PY'
          import sys, pathlib
          ver, prefix = sys.argv[1], sys.argv[2]
          p = pathlib.Path("helm/hardcode/values.yaml"); s = p.read_text()
          for old, new in (("repository: hardcode-admin\n", f"repository: {prefix}-admin\n"), ("tag: latest\n", f"tag: {ver}\n"),
                           ("image: hardcode-vscode:latest\n", f"image: {prefix}-vscode:{ver}\n"), ("squidImage: hardcode-squid:latest\n", f"squidImage: {prefix}-squid:{ver}\n")):
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          helm package helm/hardcode --version "$VER" --app-version "$VER" --destination dist
          SH
      - name: Push to GHCR (OCI)
        if: needs.version.outputs.version != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          PREFIX: ${{ needs.version.outputs.prefix }}
          BUILD_ENV: TOKEN ACTOR PREFIX
        run: |
          images/build/run.sh bash -e <<'SH'
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push dist/*.tgz "oci://${PREFIX%/hardcode}/charts"
          SH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz

  release:
    name: GitHub Release
    if: needs.version.outputs.version != ''
    needs: [version, images, app-linux, app-native, cli-linux, cli-native, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      # The source, latest.json for the app's updater (when the installers
      # are signed), the description, and every file's checksum, last.
      - name: Assemble (in the build image)
        run: |
          images/build/run.sh git archive --format=tar.gz --prefix="hardcode-$VERSION/" --output="dist/release/hardcode-$VERSION-source.tar.gz" HEAD
          images/build/run.sh release/release.py manifest --version "$VERSION" --repository "$GITHUB_REPOSITORY" dist/release
          images/build/run.sh release/release.py notes --version "$VERSION" --repository "$GITHUB_REPOSITORY" dist/notes.md
          images/build/run.sh release/release.py checksums dist/release
      # A prerelease (vX.Y.Z-N) isn't "latest": the app's updater skips it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: dist/release/*
          fail_on_unmatched_files: true
