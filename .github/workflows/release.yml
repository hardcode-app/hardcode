# On a v* tag, a release (docs/releasing.md): the tag's version written into
# everything (release/release.py stamp), the images to GHCR, the desktop app
# for three platforms (with its updater, when release/updater.pub holds the
# key its updates are signed with: they are signed by a job of their own,
# after the builds, which never hold the key), the hardcode command as binaries and as
# a Python package, the Helm chart as an OCI artifact, and a GitHub Release
# with all of it, the source, latest.json for the app's updater, checksums
# and notes. A manual run from main, and a nightly one when main has moved
# since the last, is a development build of the same, marked with its
# commit (release/release.py dev): a dev-N prerelease, which the next one
# replaces, the images' edge and sha-<commit> tags, and an X.Y.Z-dev.N
# chart. Everything published is attested: GitHub's record that this
# workflow built it, from this commit. A manual run from another branch builds everything and publishes
# nothing. Linux builds happen in the build image
# (images/build), like everything else. Each description ends with the
# known vulnerabilities in what was built and the images that are the
# boundary (the scan job; OSV-Scanner, sealed). Nothing is restored from a cache:
# any job on main (CI's, a dependency's build script in one) can write a
# cache entry, and a release builds only from the commit and what it
# downloads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Nightly, at 15:37 UTC: a development build of main (the schedule runs on
  # the default branch), skipped when main hasn't moved since the last one.
  schedule:
    - cron: "37 15 * * *"

# Read-only by default; the jobs that publish ask for what they push.
permissions:
  contents: read

jobs:
  # Whether to build: a nightly run only when main has moved since the last
  # development build, the newest dev-N prerelease, whose tag names its
  # commit; any other run always.
  # Every other job waits on the version job, which waits on this.
  changed:
    name: Changed since the last development build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true

          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                --jq '[.[] | select(.tagName | test("^dev-[0-9]+$"))][0].tagName // ""' 2>/dev/null || true
            )"
            last=""
            if [ -n "$tag" ]; then
              last="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
            fi
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "main is still at ${GITHUB_SHA::7}, the last development build's commit: nothing to build"
              build=false
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"

  version:
    name: Version
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The tag without its v; empty on a manual run.
      version: ${{ steps.version.outputs.version }}
      # "true" on a manual or nightly run from main: a development build,
      # published.
      dev: ${{ steps.version.outputs.dev }}
      # The commit, as a development build's mark and its images' tag name it.
      commit: ${{ steps.version.outputs.commit }}
      # The images' tag the chart points at: the release's version, or
      # sha-<commit>; empty when nothing is published.
      image-tag: ${{ steps.version.outputs.image-tag }}
      # The chart's version: the release's, X.Y.Z-dev.<run> for a development
      # build (X.Y.Z the checkout's, the next release's), 0.0.0-<run> else.
      chart: ${{ steps.version.outputs.chart }}
      # "true" for a release whose app has an updater (release/updater.pub
      # holds its key): its installers are signed, after they are built.
      updater: ${{ steps.version.outputs.updater }}
      # Where the images go: GHCR's names are lowercase, an owner's needn't be.
      prefix: ${{ steps.version.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      - id: version
        shell: bash
        run: |
          commit="${GITHUB_SHA::7}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Refuses a version a release can't carry, before anything is published.
            images/build/run.sh release/release.py stamp "$version"
            {
              echo "version=$version"
              echo "image-tag=$version"
              echo "chart=$version"
            } >> "$GITHUB_OUTPUT"
            if [ -f release/updater.pub ]; then
              echo "updater=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            checkout_version="$(sed -n 's/^version: //p' helm/hardcode/Chart.yaml)"
            {
              echo "dev=true"
              echo "image-tag=sha-$commit"
              echo "chart=$checkout_version-dev.$GITHUB_RUN_NUMBER"
            } >> "$GITHUB_OUTPUT"
          else
            echo "chart=0.0.0-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hardcode" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # The attestation: a token proving the run, and the right to record it.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: vscode,  context: images/vscode,  dockerfile: images/vscode/Dockerfile }
          - { name: squid,   context: images/squid,   dockerfile: images/squid/Dockerfile }
          - { name: gateway, context: images/gateway, dockerfile: images/gateway/Dockerfile }
          - { name: admin,   context: .,              dockerfile: images/admin/Dockerfile }
          - { name: docker,  context: images/docker,  dockerfile: images/docker/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The full VS Code image needs more disk than a runner has free by
      # default: the preinstalled toolchains this job doesn't use (it builds in
      # Docker) and the swap file go, with the runner's own commands rather
      # than a third-party action in a job that can push images.
      - name: Disk for the VS Code image
        if: matrix.image.name == 'vscode'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          df -h /
      - uses: ./.github/actions/buildx
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release gets its version, X.Y and latest; a prerelease its version
      # only. A development build gets edge and sha-<commit>, never latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.prefix }}-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.version != '' && !contains(needs.version.outputs.version, '-') }}
            type=raw,value=edge,enable=${{ needs.version.outputs.dev == 'true' }}
            type=raw,value=sha-${{ needs.version.outputs.commit }},enable=${{ needs.version.outputs.dev == 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ needs.version.outputs.image-tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
      # GitHub's record that this run built the image, by its digest, stored
      # beside it in the registry: gh attestation verify
      # oci://<image> --repo <owner>/hardcode checks it.
      - if: needs.version.outputs.image-tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.version.outputs.prefix }}-${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Linux artifacts are built in the build image (images/build): the same
  # Ubuntu 26.04 toolchain as everywhere else. macOS and Windows installers
  # and binaries can only be built on those platforms, so those two run
  # natively; the exception, not the rule.
  app-linux:
    name: App linux-x64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      - name: The release's version, and its updater
        if: env.VERSION != ''
        run: |
          images/build/run.sh release/release.py stamp "$VERSION"
          images/build/run.sh release/release.py updater-config --repository "$GITHUB_REPOSITORY" app/src-tauri/tauri.updater.conf.json
          echo "HARDCODE_UPDATER_CONFIG=src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
      - name: A development build's mark
        if: env.VERSION == ''
        run: images/build/run.sh release/release.py dev "$COMMIT" --run "$GITHUB_RUN_NUMBER"
      # The updater's key is nowhere here: the build runs every crate's
      # build script. The sign job signs what it built.
      - run: app/build.sh bundle
      # A development build's .deb as 0.1.0~devN, so that it installs over
      # the last one (the RPM's release is in Tauri's configuration).
      - name: A development build's Debian package
        if: env.VERSION == ''
        run: images/build/run.sh release/release.py dev-deb --run "$GITHUB_RUN_NUMBER" app/src-tauri/target/release/bundle/deb
        env:
          BUILD_ENV: HARDCODE_UPDATER_CONFIG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-linux-x64
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  app-native:
    name: App ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   triple: aarch64-apple-darwin,   arch: aarch64 }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust as app/src-tauri/rust-toolchain.toml pins it, not the newest stable.
      - id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' app/src-tauri/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      # Python and the build image's packages, by hash (.github/actions/python).
      - uses: ./.github/actions/python
      - name: The release's version, and its updater
        if: env.VERSION != ''
        shell: bash
        run: |
          python release/release.py stamp "$VERSION"
          python release/release.py updater-config --repository "$GITHUB_REPOSITORY" app/src-tauri/tauri.updater.conf.json
      - name: A development build's mark
        if: env.VERSION == ''
        shell: bash
        run: python release/release.py dev "$COMMIT" --run "$GITHUB_RUN_NUMBER"
      - name: The CLI as a sidecar
        shell: bash
        run: |
          PYTHONPATH=cli python -m hardcode_cli.stack cli/hardcode_cli/stack
          pyinstaller --onefile --name hardcode --paths cli cli/hardcode --add-data "cli/hardcode_cli/stack:hardcode_cli/stack"
          mkdir -p app/src-tauri/binaries
          cp dist/hardcode* "app/src-tauri/binaries/hardcode-${{ matrix.triple }}$([[ '${{ runner.os }}' == Windows ]] && echo .exe || true)"
      # The build image's version of the Tauri CLI.
      - name: Tauri CLI
        shell: bash
        run: |
          version="$(sed -n 's/^ARG TAURI_CLI_VERSION=//p' images/build/Dockerfile)"
          cargo install tauri-cli --locked --version "=$version"
      # No key is here: this job runs every crate's build script. The sign job
      # signs the updates; signing the macOS app, when there is a
      # certificate, belongs in a job of its own like that one.
      - name: Build
        shell: bash
        working-directory: app
        run: |
          configs=(--config src-tauri/tauri.release.conf.json)
          if [ -n "$VERSION" ]; then
            configs+=(--config src-tauri/tauri.updater.conf.json)
          fi

          # Arguments after -- go to cargo build: Cargo.lock as it is.
          cargo tauri build "${configs[@]}" -- --locked
      # What the updater applies on macOS: the app, archived (as Tauri's
      # updater archive is), named after its architecture like the other
      # installers. COPYFILE_DISABLE keeps macOS's metadata files out.
      - name: The macOS update file
        if: runner.os == 'macOS' && needs.version.outputs.updater == 'true'
        shell: bash
        working-directory: app/src-tauri/target/release/bundle/macos
        run: COPYFILE_DISABLE=1 tar -czf "HardCode_${{ matrix.arch }}.app.tar.gz" HardCode.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  cli-linux:
    name: CLI linux-x64, and its Python package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      - name: The release's version
        if: env.VERSION != ''
        run: images/build/run.sh release/release.py stamp "$VERSION"
      - run: tests/cli.py
      - name: A development build's mark
        if: env.VERSION == ''
        run: images/build/run.sh release/release.py dev "$COMMIT" --run "$GITHUB_RUN_NUMBER"
      - run: app/build.sh cli
      - run: app/build.sh wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: |
            dist/hardcode-*
            dist/hardcode_cli-*.whl
          if-no-files-found: error

  cli-native:
    name: CLI ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: macos-arm64 }
          - { os: windows-latest, target: win-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python and the build image's packages, by hash (.github/actions/python).
      - uses: ./.github/actions/python
      - name: The release's version
        if: env.VERSION != ''
        shell: bash
        run: python release/release.py stamp "$VERSION"
      - run: python -m unittest discover -s cli -t cli
      - name: A development build's mark
        if: env.VERSION == ''
        shell: bash
        run: python release/release.py dev "$COMMIT" --run "$GITHUB_RUN_NUMBER"
      - name: Build
        shell: bash
        run: |
          PYTHONPATH=cli python -m hardcode_cli.stack cli/hardcode_cli/stack
          pyinstaller --onefile --name "hardcode-${{ matrix.target }}" --paths cli cli/hardcode --add-data "cli/hardcode_cli/stack:hardcode_cli/stack"
      # The binary carries its stack: a profile can be made from it, in a home of its own.
      - name: Smoke
        shell: bash
        run: |
          binary="dist/hardcode-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            binary="$binary.exe"
          fi
          "$binary" --version

          # With no Docker daemon to ask: the runner's own networks (Windows
          # containers', on Windows) aren't what the profile is checked against.
          DOCKER_HOST=tcp://127.0.0.1:9 HARDCODE_CONFIG="$RUNNER_TEMP/home" "$binary" profile add smoke --lang ""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/hardcode-*
          if-no-files-found: error

  chart:
    name: Helm chart
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      - name: Package (in the build image)
        env:
          VER: ${{ needs.version.outputs.chart }}
          PREFIX: ${{ needs.version.outputs.prefix }}
          IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
          BUILD_ENV: VER PREFIX IMAGE_TAG
        run: |
          images/build/run.sh bash -e <<'SH'
          # The packaged chart points at the images this run publishes, at their
          # tag: a release's version, or a development build's sha-<commit>. A
          # run that publishes nothing leaves the chart's own names.
          [ -z "$IMAGE_TAG" ] || python3 - "$IMAGE_TAG" "$PREFIX" <<'PY'
          import pathlib
          import sys

          tag = sys.argv[1]
          prefix = sys.argv[2]
          values = pathlib.Path("helm/hardcode/values.yaml")
          text = values.read_text(encoding="utf-8")

          pointed = (
              ("repository: hardcode-admin\n", f"repository: {prefix}-admin\n"),
              ("tag: latest\n", f"tag: {tag}\n"),
              ("image: hardcode-vscode:latest\n", f"image: {prefix}-vscode:{tag}\n"),
              ("squidImage: hardcode-squid:latest\n", f"squidImage: {prefix}-squid:{tag}\n"),
          )
          for old, new in pointed:
              assert text.count(old) == 1, old
              text = text.replace(old, new)

          values.write_text(text, encoding="utf-8")
          PY
          helm package helm/hardcode --version "$VER" --app-version "$VER" --destination dist
          SH
      - name: Push to GHCR (OCI)
        if: needs.version.outputs.image-tag != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          PREFIX: ${{ needs.version.outputs.prefix }}
          BUILD_ENV: TOKEN ACTOR PREFIX
        run: |
          images/build/run.sh bash -e <<'SH'
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push dist/*.tgz "oci://${PREFIX%/hardcode}/charts"
          SH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz

  # Known vulnerabilities in what the build is made from (the lock files)
  # and in the images that are HardCode's boundary, as published: squid,
  # the gateway, the admin, the Docker sidecar (Docker's image with
  # HardCode's runc on top) and CoreDNS. The job holds no
  # secret and can only read; OSV-Scanner runs sealed (release/scan.sh: no
  # network, no token, read-only), so a compromised scanner could only lie
  # in its report. Reported in the description, not blocking.
  scan:
    name: Known vulnerabilities
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      PREFIX: ${{ needs.version.outputs.prefix }}
      IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      # One platform of each, the runner's, copied from its registry by
      # skopeo (no Docker daemon), with this job's read-only token.
      - name: The images, as this run published them
        if: env.IMAGE_TAG != ''
        env:
          SCAN_REGISTRY_USER: ${{ github.actor }}
          SCAN_REGISTRY_TOKEN: ${{ github.token }}
          BUILD_ENV: SCAN_REGISTRY_USER SCAN_REGISTRY_TOKEN
        run: images/build/run.sh release/scan.py save --prefix "$PREFIX" --tag "$IMAGE_TAG" dist/scan/images
      - name: OSV's databases
        run: images/build/run.sh release/scan.py databases dist/scan/db
      - name: Scan, sealed
        run: |
          mkdir -p dist/scan/images dist/scan/reports
          release/scan.sh dist/scan/db dist/scan/images dist/scan/reports
      - name: The description's section
        run: |
          version="$(sed -n 's/^ARG OSV_SCANNER_VERSION=//p' images/build/Dockerfile)"
          images/build/run.sh release/scan.py summary dist/scan/reports --scanner "OSV-Scanner $version" --out dist/scan/vulnerabilities.md
          cat dist/scan/vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerabilities
          path: |
            dist/scan/vulnerabilities.md
            dist/scan/vulnerabilities.json
          if-no-files-found: error

  # The updater's signatures, made apart from every build: this job builds
  # nothing, holds the key, and runs only the Tauri CLI's signer (the build
  # image's, checksum-pinned) over the installers the app jobs made.
  sign:
    name: Sign the app's updates
    if: needs.version.outputs.updater == 'true'
    needs: [version, app-linux, app-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "app-*"
          path: dist/sign
          merge-multiple: true
      - name: Sign (in the build image)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUILD_ENV: TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        run: |
          images/build/run.sh release/release.py gather dist/sign
          images/build/run.sh release/release.py sign --version "$VERSION" dist/sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: dist/sign/*.sig
          if-no-files-found: error

  release:
    name: GitHub Release
    # After sign, which is skipped when the release has no updater.
    if: ${{ !failure() && !cancelled() && needs.version.outputs.version != '' }}
    needs: [version, images, app-linux, app-native, cli-linux, cli-native, chart, sign, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The attestation: a token proving the run, and the right to record it.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      # The builds' files only: not the build records Docker's builds upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{app-*,cli-*,chart,signatures}"
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnerabilities
          path: dist/vulnerabilities
      # The builds' files out of their folders, the source, latest.json for
      # the app's updater (when the installers are signed), the
      # description with the known vulnerabilities, and every file's
      # checksum, last.
      - name: Assemble (in the build image)
        run: |
          images/build/run.sh release/release.py gather dist/release
          images/build/run.sh git archive --format=tar.gz --prefix="hardcode-$VERSION/" --output="dist/release/hardcode-$VERSION-source.tar.gz" HEAD
          images/build/run.sh release/release.py manifest --version "$VERSION" --repository "$GITHUB_REPOSITORY" dist/release
          images/build/run.sh release/release.py notes --version "$VERSION" --repository "$GITHUB_REPOSITORY" dist/notes.md
          printf '\n' >> dist/notes.md
          cat dist/vulnerabilities/vulnerabilities.md >> dist/notes.md
          cp dist/vulnerabilities/vulnerabilities.json dist/release/
          images/build/run.sh release/release.py checksums dist/release
      # GitHub's record that this run built each file, from this commit:
      # gh attestation verify FILE --repo <owner>/hardcode checks one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      # With gh on the runner, not a third-party action holding this job's
      # token. The release is the pushed tag's (--verify-tag: no tag is made
      # here); its description is the notes, then GitHub's list of what was
      # merged. A prerelease (vX.Y.Z-N) isn't "latest": the app's updater
      # skips it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --generate-notes \
            "${prerelease[@]}"

  # A development build (a manual or nightly run from main): a dev-N
  # prerelease with everything the run built, replacing the last one. A
  # prerelease is never GitHub's latest release, so the app's updater never
  # offers it.
  dev-release:
    name: Development build
    if: needs.version.outputs.dev == 'true'
    needs: [version, images, app-linux, app-native, cli-linux, cli-native, chart, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One replacement at a time.
    concurrency:
      group: dev-release
    permissions:
      contents: write
      # The attestation: a token proving the run, and the right to record it.
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ needs.version.outputs.commit }}
      CHART: ${{ needs.version.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          cache: false
      # The builds' files only: not the build records Docker's builds upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{app-*,cli-*,chart}"
          path: dist/dev
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnerabilities
          path: dist/vulnerabilities
      - name: Assemble (in the build image)
        run: |
          images/build/run.sh release/release.py gather dist/dev
          images/build/run.sh release/release.py dev-notes --commit "$COMMIT" --run "$GITHUB_RUN_NUMBER" --chart "$CHART" --repository "$GITHUB_REPOSITORY" dist/dev-notes.md
          printf '\n' >> dist/dev-notes.md
          cat dist/vulnerabilities/vulnerabilities.md >> dist/dev-notes.md
          cp dist/vulnerabilities/vulnerabilities.json dist/dev/
          images/build/run.sh release/release.py checksums dist/dev
      # Only main's newest build is published. When main has moved on since
      # this run's commit, nothing is, and the last build stays until the
      # nightly run builds main as it is (GitHub would refuse this job's token
      # a tag on a commit whose workflows differ from main's anyway).
      - id: current
        name: Still main's newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to ${main::7} since this build's ${GITHUB_SHA::7}: not published; the last development build stays"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      # GitHub's record that this run built each file, from this commit.
      - if: steps.current.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dev/*
      # A tag of its own each time, dev-<run>: a published release's tag is
      # never used again once releases are immutable. The new build first,
      # then the ones before it go, so there is always one.
      - name: Publish, then retire the last development build
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-${{ github.run_number }}
        run: |
          gh release create "$TAG" dist/dev/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Development build ($COMMIT)" \
            --notes-file dist/dev-notes.md

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName | select(test("^dev-[0-9]+$"))' \
            | while read -r old; do
                if [ "$old" != "$TAG" ]; then
                  gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                fi
              done
